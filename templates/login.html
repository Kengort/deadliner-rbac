{% extends "base.html" %}

{% block title %}Вход — Flux{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-md w-full mx-auto">
        <form method="post"
              class="w-full bg-white/95 backdrop-blur-md rounded-2xl border border-slate-100 p-10 shadow-xl space-y-8">
            <div class="space-y-2">
                <h1 class="text-4xl font-extrabold tracking-tight text-slate-950">Вход во Flux</h1>
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] uppercase tracking-widest font-bold text-slate-400">Email</label>
                <input type="email" name="email" required
                       class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] uppercase tracking-widest font-bold text-slate-400">Пароль</label>
                <div class="relative">
                    <input id="password" type="password" name="password" required
                           class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-10 text-sm text-slate-900 shadow-sm focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all">
                    <button type="button" id="toggle-password"
                            class="absolute inset-y-0 right-3 inline-flex items-center justify-center px-2 text-slate-400 hover:text-slate-600"
                            aria-label="Показать пароль">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="inline-flex items-center gap-2 text-slate-600 select-none">
                    <input type="checkbox" name="remember" class="rounded border-slate-300">
                    <span>Запомнить меня</span>
                </label>
            </div>

            <button type="submit"
                    class="w-full inline-flex justify-center rounded-full bg-gradient-to-br from-indigo-600 to-violet-700 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-200 hover:from-indigo-700 hover:to-violet-800 transition-all">
                Войти
            </button>

            <p class="text-[11px] text-slate-500 text-center">
                Нет аккаунта?
                <a href="{{ url_for('register') }}" class="text-indigo-600 hover:text-indigo-700 font-medium">Регистрация</a>
            </p>
        </form>
    </div>
</div>

<script>
    (function () {
        const input = document.getElementById('password');
        const btn = document.getElementById('toggle-password');
        if (!input || !btn) return;
        btn.addEventListener('click', () => {
            input.type = (input.type === 'password') ? 'text' : 'password';
        });
    })();
</script>
{% endblock %}
