{% extends "base.html" %}

{% block title %}Вход — Project Tracker{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="max-w-md mx-auto flex items-center justify-center min-h-[70vh]">
        <form method="post"
              class="w-full bg-white/80 backdrop-blur rounded-2xl border border-slate-200/80 p-6 shadow-xl space-y-4">
            <div class="space-y-1">
                <h2 class="text-xl font-semibold text-slate-900">Вход</h2>
                <p class="text-sm text-slate-500">Project Tracker SaaS</p>
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required
                       class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">Пароль</label>
                <div class="relative">
                    <input id="password" type="password" name="password" required
                           class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 pr-10 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
                    <button type="button" id="toggle-password"
                            class="absolute inset-y-0 right-2 inline-flex items-center justify-center px-2 text-slate-500 hover:text-slate-700"
                            aria-label="Показать пароль">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <label class="inline-flex items-center gap-2 text-sm text-slate-600 select-none">
                <input type="checkbox" name="remember" class="rounded border-slate-300">
                <span>Запомнить меня</span>
            </label>

            <button type="submit"
                    class="w-full inline-flex justify-center rounded-full bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-indigo-700">
                Войти
            </button>

            <p class="text-xs text-slate-500 text-center">
                Нет аккаунта?
                <a href="{{ url_for('register') }}" class="text-indigo-600 hover:text-indigo-700 font-medium">Регистрация</a>
            </p>
        </form>
    </div>
</div>

<script>
    (function () {
        const input = document.getElementById('password');
        const btn = document.getElementById('toggle-password');
        if (!input || !btn) return;
        btn.addEventListener('click', () => {
            input.type = (input.type === 'password') ? 'text' : 'password';
        });
    })();
</script>
{% endblock %}
