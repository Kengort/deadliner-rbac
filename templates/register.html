{% extends "base.html" %}

{% block title %}Регистрация — Project Tracker{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="max-w-md mx-auto flex items-center justify-center min-h-[70vh]">
        <form method="post"
              class="w-full bg-white/80 backdrop-blur rounded-2xl border border-slate-200/80 p-6 shadow-xl space-y-4">
            <div class="space-y-1">
                <h2 class="text-xl font-semibold text-slate-900">Регистрация</h2>
                <p class="text-sm text-slate-500">Роль по умолчанию: Worker</p>
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">ФИО</label>
                <input type="text" name="full_name" required
                       class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">Должность (опционально)</label>
                <input type="text" name="position"
                       class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required
                       class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
            </div>

            <div>
                <label class="block text-sm text-slate-700 mb-1">Пароль</label>
                <input type="password" name="password" required
                       class="w-full rounded-xl border border-transparent bg-slate-50 px-3 py-2 text-sm shadow-sm focus:bg-white focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10">
            </div>

            <button type="submit"
                    class="w-full inline-flex justify-center rounded-full bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-indigo-700">
                Создать аккаунт
            </button>

            <p class="text-xs text-slate-500 text-center">
                Уже есть аккаунт?
                <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-700 font-medium">Войти</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
